name: Deploy to TKE

on:
  push:
    tags:
      - 'v*'
      - 'dev-tag/v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options: [staging, production]

env:
  TCR_REGISTRY: sgccr.ccs.tencentyun.com
  TCR_NAMESPACE: __TCR_NAMESPACE__
  IMAGE_NAME: __IMAGE_NAME__

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: npx tsc --noEmit

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test]
    if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
    outputs:
      image-version: ${{ steps.meta.outputs.version }}

    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Login to TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Compute version tag
        id: meta
        run: |
          if [[ "${{ github.ref }}" == refs/tags/dev-tag/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/dev-tag/}
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          elif [[ "${{ github.ref }}" == refs/heads/main ]]; then
            VERSION=latest
          else
            VERSION=dev-$(date +%Y%m%d)-${GITHUB_SHA::8}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ env.IMAGE_NAME }}
          cache-to: type=gha,mode=min,scope=${{ env.IMAGE_NAME }}
          platforms: linux/amd64

  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.result == 'success' && startsWith(github.ref_name, 'dev-tag/')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Run DB migration
        env:
          IMAGE: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }}
          JOB_NAME: prisma-migrate-${{ github.run_id }}
          NAMESPACE: __APP_NAME__-dev
        run: |
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
            namespace: $NAMESPACE
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: tcr-secret
                containers:
                  - name: migrate
                    image: $IMAGE
                    command: ["sh", "-c", "npx prisma db push"]
                    envFrom:
                      - secretRef:
                          name: __APP_NAME__-secrets
          EOF
          kubectl wait --for=condition=complete job/$JOB_NAME -n "$NAMESPACE" --timeout=5m
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found

      - name: Update deployment
        run: |
          kubectl set image deployment/__APP_NAME__-web \
            web=${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }} \
            -n __APP_NAME__-dev
          kubectl rollout status deployment/__APP_NAME__-web -n __APP_NAME__-dev --timeout=5m

      - name: Health check
        run: |
          sleep 20
          curl -f http://__INGRESS_IP__/api/health

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build]
    if: needs.build.result == 'success' && startsWith(github.ref_name, 'v') && !startsWith(github.ref_name, 'dev-tag/')
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Configure kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Run DB migration
        env:
          IMAGE: ${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }}
          JOB_NAME: prisma-migrate-${{ github.run_id }}
          NAMESPACE: __APP_NAME__-prod
        run: |
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found
          cat <<EOF | kubectl apply -f -
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: $JOB_NAME
            namespace: $NAMESPACE
          spec:
            backoffLimit: 1
            ttlSecondsAfterFinished: 300
            template:
              spec:
                restartPolicy: Never
                imagePullSecrets:
                  - name: tcr-secret
                containers:
                  - name: migrate
                    image: $IMAGE
                    command: ["sh", "-c", "npx prisma migrate deploy"]
                    envFrom:
                      - secretRef:
                          name: __APP_NAME__-secrets
          EOF
          kubectl wait --for=condition=complete job/$JOB_NAME -n "$NAMESPACE" --timeout=10m
          kubectl delete job "$JOB_NAME" -n "$NAMESPACE" --ignore-not-found

      - name: Update deployment
        run: |
          kubectl set image deployment/__APP_NAME__-web \
            web=${{ env.TCR_REGISTRY }}/${{ env.TCR_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ needs.build.outputs.image-version }} \
            -n __APP_NAME__-prod
          kubectl rollout status deployment/__APP_NAME__-web -n __APP_NAME__-prod --timeout=10m

      - name: Health check
        run: |
          sleep 30
          curl -f https://__DOMAIN__/api/health

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
